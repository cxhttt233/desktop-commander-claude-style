<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop Commander · 使用统计</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--soft:#f8fafc;--line:#e6eaf0;--line2:#edf0f4;--muted:#718096;--text:#172033;--blue:#3b82f6;--violet:#7c6cf2;--green:#16a36a;--red:#dc5960;--amber:#d89424}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:1520px;margin:auto;padding:34px 34px 48px}.top{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:22px}
h1{font-size:27px;letter-spacing:-.025em;line-height:1.15;margin:0;font-weight:720}.ranges,.metric-tabs{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{border:0;background:transparent;color:#78869a;padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit;transition:.15s ease}button:hover{color:#334155;background:#f6f8fb}button.on{color:#1d4ed8;background:#edf5ff;font-weight:650}
.cards{display:grid;grid-template-columns:1.18fr repeat(5,1fr);gap:12px;margin-bottom:12px}.card,.panel{border:1px solid var(--line);background:var(--panel);box-shadow:0 1px 2px rgba(16,24,40,.025),0 7px 22px rgba(16,24,40,.035)}
.card{min-height:124px;border-radius:15px;padding:18px 19px}.card:first-child{background:#f8fbff;border-color:#cfe0f6}.k{color:#718096;font-size:11px;font-weight:600}.v{font-size:28px;font-weight:730;letter-spacing:-.035em;line-height:1.1;margin-top:13px;color:#172033}.card:first-child .v{font-size:32px;color:#1e5faf}.meta{margin-top:10px;color:#8995a8;font-size:10.5px}.meta strong{color:#536176;font-weight:650}
.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(360px,.82fr);gap:12px;margin:12px 0}.grid.equal{grid-template-columns:1fr 1fr}.panel{border-radius:15px;padding:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px}.panel h2{font-size:14px;color:#28364a;font-weight:680;margin:0}.legend{display:flex;gap:14px;color:#7b8798;font-size:10.5px;white-space:nowrap}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.legend .in{background:var(--blue)}.legend .out{background:var(--violet)}.legend .fail{background:var(--red)}
canvas{width:100%;height:248px;display:block}.compact canvas{height:195px}.split-wrap{display:grid;grid-template-columns:190px 1fr;align-items:center;min-height:248px}.split-wrap canvas{height:190px}.split-stats{display:grid;gap:14px}.split-row{padding-bottom:12px;border-bottom:1px solid var(--line2)}.split-row:last-child{border-bottom:0;padding-bottom:0}.split-name{font-size:11px;color:#78869a}.split-value{font-size:19px;font-weight:710;margin-top:4px}.split-note{font-size:10px;color:#9aa5b4;margin-top:3px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}th,td{padding:9px 9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:#8a96a8;font-size:10px;font-weight:620}tbody tr:hover td{background:#fafbfd}tbody tr:last-child td{border-bottom:0}.bad{color:var(--red);font-weight:650}.ok{color:var(--green);font-weight:650}.scroll{overflow:auto;border:1px solid var(--line2);border-radius:10px;max-height:430px}.rank-name{max-width:220px;overflow:hidden;text-overflow:ellipsis}.rank-main{font-weight:680;color:#26364c}
@media(max-width:1220px){.cards{grid-template-columns:repeat(3,1fr)}.grid,.grid.equal{grid-template-columns:1fr}.split-wrap{grid-template-columns:180px 1fr}}@media(max-width:720px){main{padding:22px 14px 34px}.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.ranges{width:100%}.ranges button{flex:1}.v{font-size:23px}.split-wrap{grid-template-columns:1fr}.split-stats{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="top"><h1>Desktop Commander 使用统计</h1><div class="ranges"><button data-d="1">今日</button><button data-d="7">7天</button><button data-d="30" class="on">30天</button><button data-d="90">90天</button></div></div>
<div class="cards" id="cards"></div>
<div class="grid"><section class="panel"><div class="panel-head"><h2>Token 趋势</h2><div class="legend"><span><i class="in"></i>模型输入</span><span><i class="out"></i>模型输出</span></div></div><canvas id="tokens"></canvas></section>
<section class="panel"><div class="panel-head"><h2>模型输入 / 输出构成</h2></div><div class="split-wrap"><canvas id="split"></canvas><div class="split-stats" id="splitStats"></div></div></section></div>
<div class="grid equal"><section class="panel compact"><div class="panel-head"><h2>每日调用趋势</h2><div class="legend"><span><i class="in"></i>调用</span><span><i class="fail"></i>失败</span></div></div><canvas id="dailyCalls"></canvas></section>
<section class="panel compact"><div class="panel-head"><h2>24 小时调用分布</h2></div><canvas id="hourly"></canvas></section></div>
<div class="grid equal"><section class="panel"><div class="panel-head"><h2>工具 Token 排行</h2></div><div class="scroll" id="tools"></div></section>
<section class="panel"><div class="panel-head"><h2>任务 / 子 Agent Token 排行</h2></div><div class="scroll" id="tasks"></div></section></div>
<section class="panel"><div class="panel-head"><h2>最近调用</h2></div><div class="scroll"><table><thead><tr><th>时间</th><th>任务</th><th>工具</th><th>状态</th><th>模型输入 Token</th><th>模型输出 Token</th><th>耗时</th></tr></thead><tbody id="recent"></tbody></table></div></section>
<script>
const f=n=>{n=Number(n)||0;if(n<1e3)return String(Math.round(n));if(n<1e6)return (n/1e3).toFixed(n<1e4?1:0)+'K';return (n/1e6).toFixed(n<1e7?2:1)+'M'},pct=(a,b)=>b?(a/b*100).toFixed(1):'0.0',esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setup(id){const c=document.getElementById(id),r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);return{c,x,w,h}}
function axes(x,w,h,max,p={l:48,r:16,t:12,b:28}){const cw=w-p.l-p.r,ch=h-p.t-p.b;x.font='10px system-ui';x.textAlign='right';for(let i=0;i<4;i++){const y=p.t+ch*i/3;x.strokeStyle='#edf0f4';x.lineWidth=1;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillStyle='#98a3b3';x.fillText(f(max*(1-i/3)),p.l-7,y+3)}return{...p,cw,ch}}
function tokenChart(rows){const{x,w,h}=setup('tokens'),max=Math.max(1,...rows.flatMap(v=>[v.outputTokens,v.inputTokens])),p=axes(x,w,h,max),step=p.cw/Math.max(1,rows.length-1);const series=[{key:'outputTokens',color:'#3b82f6'},{key:'inputTokens',color:'#7c6cf2'}];for(const s of series){const pts=rows.map((v,i)=>[p.l+(rows.length===1?p.cw/2:i*step),p.t+p.ch-p.ch*v[s.key]/max]);x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=s.color;x.lineWidth=2;x.lineJoin='round';x.lineCap='round';x.stroke()}const every=rows.length<=7?1:Math.max(1,Math.ceil(rows.length/7));x.textAlign='center';x.fillStyle='#98a3b3';rows.forEach((v,i)=>{if(i%every===0||i===rows.length-1)x.fillText(v.day.slice(5),p.l+(rows.length===1?p.cw/2:i*step),h-7)})}
function splitChart(d){const{x,w,h}=setup('split'),a=d.range.outputTokens||0,b=d.range.inputTokens||0,total=Math.max(1,a+b),cx=w/2,cy=h/2,r=Math.min(w,h)*.31;x.lineWidth=18;x.strokeStyle='#edf0f4';x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();let start=-Math.PI/2;for(const [v,color] of [[a,'#3b82f6'],[b,'#7c6cf2']]){const end=start+Math.PI*2*v/total;x.strokeStyle=color;x.lineCap='butt';x.beginPath();x.arc(cx,cy,r,start,end);x.stroke();start=end}x.textAlign='center';x.fillStyle='#172033';x.font='700 20px system-ui';x.fillText(f(a+b),cx,cy+2);x.fillStyle='#8a96a8';x.font='10px system-ui';x.fillText('Tokens',cx,cy+18);document.getElementById('splitStats').innerHTML='<div class="split-row"><div class="split-name">模型输入</div><div class="split-value">'+f(a)+'</div><div class="split-note">工具结果 · '+pct(a,a+b)+'%</div></div><div class="split-row"><div class="split-name">模型输出</div><div class="split-value">'+f(b)+'</div><div class="split-note">工具参数 · '+pct(b,a+b)+'%</div></div>'}
function barChart(id,rows,key,failKey,labelKey){const{x,w,h}=setup(id),max=Math.max(1,...rows.map(v=>v[key])),p={l:16,r:12,t:10,b:28},cw=w-p.l-p.r,ch=h-p.t-p.b,gap=id==='hourly'?4:Math.max(4,Math.min(9,cw/Math.max(1,rows.length)*.24)),bw=Math.max(3,cw/Math.max(1,rows.length)-gap);rows.forEach((v,i)=>{const bh=Math.max(v[key]?3:0,ch*v[key]/max),px=p.l+i*(bw+gap);x.fillStyle='#dbeafe';x.fillRect(px,p.t+ch-bh,bw,bh);if(failKey&&v[failKey]){const fh=Math.max(3,ch*v[failKey]/max);x.fillStyle='#f3a7aa';x.fillRect(px+bw*.62,p.t+ch-fh,bw*.38,fh)}x.fillStyle='#98a3b3';x.font='9px system-ui';x.textAlign='center';if(id==='hourly'||rows.length<=7||i%Math.max(1,Math.ceil(rows.length/7))===0||i===rows.length-1)x.fillText(labelKey==='hour'?String(v.hour).padStart(2,'0'):v.day.slice(5),px+bw/2,h-7)})}
function rankTable(rows){return '<table><thead><tr><th>名称</th><th>总 Tokens</th><th>模型输入</th><th>模型输出</th><th>调用</th><th>失败</th><th>平均耗时</th></tr></thead><tbody>'+rows.map(x=>'<tr><td class="rank-name">'+esc(x.name)+'</td><td class="rank-main">'+f(x.totalTokens)+'</td><td>'+f(x.outputTokens)+'</td><td>'+f(x.inputTokens)+'</td><td>'+f(x.calls)+'</td><td class="'+(x.failures?'bad':'')+'">'+f(x.failures)+'</td><td>'+f(x.avgDurationMs)+' ms</td></tr>').join('')+'</tbody></table>'}
async function load(days=30){const d=await fetch('/api/summary?days='+days,{cache:'no-store'}).then(r=>r.json()),total=d.range.totalTokens||0,modelIn=d.range.outputTokens||0,modelOut=d.range.inputTokens||0,failRate=d.range.calls?d.range.failures/d.range.calls*100:0,period=days===1?'今日':'近'+days+'天',activeDays=Math.max(1,d.byDay.filter(x=>x.calls>0).length);const cards=[['总 Tokens',f(total),period+' · 日均 '+f(Math.round(total/activeDays))],['模型输入 Tokens',f(modelIn),'工具结果 · '+pct(modelIn,total)+'%'],['模型输出 Tokens',f(modelOut),'工具参数 · '+pct(modelOut,total)+'%'],['调用次数',f(d.range.calls),'成功 '+f(Math.max(0,d.range.calls-d.range.failures))+' 次'],['失败次数',f(d.range.failures),'失败率 '+failRate.toFixed(2)+'%'],['平均耗时',f(d.range.avgDurationMs)+' ms','累计 '+f(d.range.durationMs)+' ms']];document.getElementById('cards').innerHTML=cards.map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="meta">'+x[2]+'</div></div>').join('');tokenChart(d.byDay);splitChart(d);barChart('dailyCalls',d.byDay,'calls','failures','day');barChart('hourly',d.byHour,'calls',null,'hour');document.getElementById('tools').innerHTML=rankTable(d.tools);document.getElementById('tasks').innerHTML=rankTable(d.tasks);document.getElementById('recent').innerHTML=d.recent.map(x=>'<tr><td>'+new Date(x.ts).toLocaleString()+'</td><td>'+esc(x.taskLabel||'未标注')+'</td><td>'+esc(x.tool)+'</td><td class="'+(x.status==='error'?'bad':'ok')+'">'+esc(x.status)+'</td><td>'+f(x.outputTokens)+'</td><td>'+f(x.inputTokens)+'</td><td>'+f(x.durationMs)+' ms</td></tr>').join('')}
document.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-d]').forEach(x=>x.classList.remove('on'));b.classList.add('on');load(Number(b.dataset.d))});addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(()=>load(Number(document.querySelector('button.on').dataset.d)),120)});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(Number(document.querySelector('button.on').dataset.d))});setInterval(()=>{if(!document.hidden)load(Number(document.querySelector('button.on').dataset.d))},5000);let uiVersion=null;async function checkUi(){try{const v=(await fetch('/api/ui-version',{cache:'no-store'}).then(r=>r.json())).version;if(uiVersion===null)uiVersion=v;else if(v&&v!==uiVersion)location.reload()}catch{}}setInterval(checkUi,2000);checkUi();load();
</script></main></body></html>
