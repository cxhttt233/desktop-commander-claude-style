<div class="top"><h1>Desktop Commander 使用统计</h1><div class="ranges"><button data-days="1">今日</button><button data-days="7">7天</button><button data-days="30" class="on">30天</button><button data-days="90">90天</button></div></div>
<div class="controls"><label class="ctl">分析口径<select id="metric"><option value="totalTokens">总 Tokens</option><option value="modelInput">模型输入 Tokens</option><option value="modelOutput">模型输出 Tokens</option><option value="calls">调用次数</option><option value="failures">失败次数</option><option value="durationMs">总耗时</option></select></label><label class="ctl">构成维度<select id="group"><option value="tool">工具</option><option value="task">任务 / 子 Agent</option></select></label><label class="ctl">状态<select id="status"><option value="">全部</option><option value="ok">成功</option><option value="error">失败</option><option value="unknown">未知</option></select></label><button class="clear" id="clear" type="button">清除筛选</button><div class="scope" id="scope"></div></div>
<div class="chips" id="chips"></div><div class="cards" id="cards"></div>
<div class="grid"><section class="panel"><div class="panel-head"><div><h2 id="trendTitle">趋势</h2><div class="hint">悬浮查看详情 · 点击日期筛选</div></div></div><div class="chart-wrap"><canvas class="chart" id="trend"></canvas></div></section>
<section class="panel"><div class="panel-head"><div><h2 id="donutTitle">构成</h2><div class="hint">点击扇区或图例钻取</div></div></div><div class="donut-layout"><canvas class="donut" id="donut"></canvas><div class="legend" id="legend"></div></div></section></div>
<div class="grid equal"><section class="panel"><div class="panel-head"><div><h2>工具排行</h2><div class="hint">按当前分析口径排序 · 点击行筛选</div></div><input class="search" id="toolSearch" placeholder="搜索工具"></div><div class="scroll" id="tools"></div></section>
<section class="panel"><div class="panel-head"><div><h2>任务 / 子 Agent 排行</h2><div class="hint">输入 / 输出同时保留 · 点击行筛选</div></div><input class="search" id="taskSearch" placeholder="搜索任务"></div><div class="scroll" id="tasks"></div></section></div>
<section class="panel"><div class="panel-head"><div><h2 id="hourTitle">24 小时分布</h2><div class="hint">悬浮查看详情 · 点击小时筛选</div></div></div><div class="chart-wrap"><canvas class="chart hour-chart" id="hour"></canvas></div></section>
<section class="panel" style="margin-top:12px"><div class="panel-head"><div><h2>最近调用</h2><div class="hint" id="recentHint">筛选条件同步作用于明细</div></div></div><div class="scroll"><table><thead><tr><th>时间</th><th>任务</th><th>工具</th><th>状态</th><th>模型输入</th><th>模型输出</th><th>耗时</th></tr></thead><tbody id="recent"></tbody></table></div></section>
<div class="detail-backdrop" id="detailBackdrop" aria-hidden="true">
<aside class="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
<div class="detail-head"><div><div class="detail-title" id="detailTitle">调用详情</div><div class="detail-sub" id="detailSub">实际参数与返回内容</div></div><button class="detail-close" id="detailClose" type="button" aria-label="关闭">×</button></div>
<div class="detail-body" id="detailBody"><div class="detail-loading">正在读取调用详情…</div></div>
</aside></div>
<div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],f=n=>{n=Number(n)||0;if(n<1e3)return String(Math.round(n));if(n<1e6)return (n/1e3).toFixed(n<1e4?1:0)+'K';return (n/1e6).toFixed(n<1e7?2:1)+'M'},fd=n=>{n=Number(n)||0;if(n<1000)return Math.round(n)+' ms';if(n<60000)return (n/1000).toFixed(n<10000?1:0)+' s';if(n<3600000)return (n/60000).toFixed(1)+' min';return (n/3600000).toFixed(1)+' h'},pct=(a,b)=>b?(a/b*100).toFixed(1):'0.0',esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const state={days:30,metric:'totalTokens',group:'tool',filters:{tool:'',task:'',status:'',day:'',hour:null},toolSearch:'',taskSearch:''};let data=null,loadSeq=0;const hit={trend:[],hour:[],donut:[]},palette=['#3978e6','#7b68d9','#18a0a5','#d79a31','#dd6f79','#5870c7','#3f9b6c','#52a7d7'];
const tip=$('#tip');function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const x=Math.min(innerWidth-320,e.clientX+14),y=Math.min(innerHeight-120,e.clientY+14);tip.style.left=x+'px';tip.style.top=y+'px'}function hideTip(){tip.style.display='none'}

function renderChrome(){$$('[data-days]').forEach(b=>b.classList.toggle('on',Number(b.dataset.days)===state.days));$('#metric').value=state.metric;$('#group').value=state.group;$('#status').value=state.filters.status;$('#clear').disabled=!hasFilters();const s=data?.scope?.calls||0,r=data?.range?.calls||0;$('#scope').textContent=hasFilters()?('筛选后 '+f(r)+' 次 / 范围 '+f(s)+' 次 · '+pct(r,s)+'%'):('范围内 '+f(s)+' 次调用');const labels={tool:'工具',task:'任务',status:'状态',day:'日期',hour:'小时'};$('#chips').innerHTML=Object.entries(state.filters).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>'<button class="chip" data-chip="'+k+'"><b>'+labels[k]+'</b>'+esc(k==='hour'?String(v).padStart(2,'0')+':00':v)+' <span>×</span></button>').join('');$$('[data-chip]').forEach(b=>b.onclick=()=>{state.filters[b.dataset.chip]=b.dataset.chip==='hour'?null:'';if(b.dataset.chip==='status')$('#status').value='';load()})}
function renderCards(){const r=data.range,scope=data.scope||r,total=r.totalTokens||0,cards=[['totalTokens','总 Tokens',f(r.totalTokens),hasFilters()?'占范围 '+pct(r.totalTokens,scope.totalTokens)+'%':(state.days===1?'今日':'近'+state.days+'天')],['modelInput','模型输入 Tokens',f(r.outputTokens),'工具结果 · '+pct(r.outputTokens,total)+'%'],['modelOutput','模型输出 Tokens',f(r.inputTokens),'工具参数 · '+pct(r.inputTokens,total)+'%'],['calls','调用次数',f(r.calls),'成功 '+f(Math.max(0,r.calls-r.failures))+' 次'],['failures','失败次数',f(r.failures),'失败率 '+pct(r.failures,r.calls)+'%'],['durationMs','总耗时',fd(r.durationMs),'平均 '+fd(r.avgDurationMs)]];$('#cards').innerHTML=cards.map(c=>'<button class="card '+(state.metric===c[0]?'on':'')+'" data-card="'+c[0]+'"><div class="k">'+c[1]+'</div><div class="v">'+c[2]+'</div><div class="meta">'+c[3]+'</div></button>').join('');$$('[data-card]').forEach(b=>b.onclick=()=>{state.metric=b.dataset.card;$('#metric').value=state.metric;renderAll()})}

function renderTrend(){const {c,x,w,h}=setup('#trend'),rows=data.byDay||[],series=trendSeries(),m=metrics[state.metric],max=Math.max(1,...rows.flatMap(r=>series.map(s=>s.value(r)))),p={l:54,r:18,t:18,b:30},cw=w-p.l-p.r,ch=h-p.t-p.b,step=cw/Math.max(1,rows.length-1);$('#trendTitle').textContent=state.metric==='totalTokens'?'Token 趋势 · 输入 / 输出':m.label+'趋势';x.font='10px system-ui';x.textAlign='right';for(let i=0;i<4;i++){const y=p.t+ch*i/3;x.strokeStyle='#edf1f5';x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillStyle='#97a2b1';x.fillText(m.fmt(max*(1-i/3)),p.l-7,y+3)}if(state.filters.day){const idx=rows.findIndex(r=>r.day===state.filters.day);if(idx>=0){const px=p.l+(rows.length===1?cw/2:idx*step);x.fillStyle='#edf4ff';x.fillRect(px-Math.max(5,step/2),p.t,Math.max(10,step),ch)}}for(const s of series){const pts=rows.map((r,i)=>[p.l+(rows.length===1?cw/2:i*step),p.t+ch-ch*s.value(r)/max]);x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=s.color;x.lineWidth=2;x.lineJoin='round';x.lineCap='round';x.stroke()}const every=rows.length<=7?1:Math.max(1,Math.ceil(rows.length/7));x.textAlign='center';x.fillStyle='#929eae';rows.forEach((r,i)=>{const px=p.l+(rows.length===1?cw/2:i*step);if(i%every===0||i===rows.length-1)x.fillText(r.day.slice(5),px,h-7)});hit.trend=rows.map((r,i)=>({x:p.l+(rows.length===1?cw/2:i*step),row:r}));c.onmousemove=e=>{if(!hit.trend.length)return;const q=hit.trend.reduce((a,b)=>Math.abs(b.x-e.offsetX)<Math.abs(a.x-e.offsetX)?b:a);if(Math.abs(q.x-e.offsetX)>Math.max(22,step*.55))return hideTip();const lines=series.map(s=>'<div class="tip-row"><span>'+s.label+'</span><span>'+m.fmt(s.value(q.row))+'</span></div>').join('');showTip(e,'<strong>'+q.row.day+'</strong>'+lines+'<div class="tip-row"><span>调用</span><span>'+f(q.row.calls)+'</span></div>')};c.onmouseleave=hideTip;c.onclick=e=>{if(!hit.trend.length)return;const q=hit.trend.reduce((a,b)=>Math.abs(b.x-e.offsetX)<Math.abs(a.x-e.offsetX)?b:a);if(Math.abs(q.x-e.offsetX)<=Math.max(22,step*.55))setFilter('day',q.row.day)}}
function renderHour(){const {c,x,w,h}=setup('#hour'),rows=data.byHour||[],m=metrics[state.metric],max=Math.max(1,...rows.map(m.value)),p={l:44,r:14,t:14,b:28},cw=w-p.l-p.r,ch=h-p.t-p.b,gap=4,bw=Math.max(4,cw/24-gap);$('#hourTitle').textContent='24 小时分布 · '+m.label;hit.hour=[];x.font='9px system-ui';x.textAlign='right';for(let i=0;i<3;i++){const y=p.t+ch*i/2;x.strokeStyle='#eef1f5';x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillStyle='#9aa5b4';x.fillText(m.fmt(max*(1-i/2)),p.l-6,y+3)}rows.forEach((r,i)=>{const v=m.value(r),bh=v?Math.max(3,ch*v/max):0,px=p.l+i*(bw+gap);if(state.filters.hour===r.hour){x.fillStyle='#edf4ff';x.fillRect(px-2,p.t,bw+4,ch)}x.fillStyle=state.metric==='failures'?'#e69a9f':'#a9c9f6';x.fillRect(px,p.t+ch-bh,bw,bh);x.fillStyle='#929eae';x.textAlign='center';if(i%2===0)x.fillText(String(r.hour).padStart(2,'0'),px+bw/2,h-7);hit.hour.push({x:px,y:p.t+ch-bh,w:bw,h:Math.max(bh,6),row:r})});c.onmousemove=e=>{const q=hit.hour.find(v=>e.offsetX>=v.x-2&&e.offsetX<=v.x+v.w+2);if(!q)return hideTip();showTip(e,'<strong>'+String(q.row.hour).padStart(2,'0')+':00–'+String((q.row.hour+1)%24).padStart(2,'0')+':00</strong><div class="tip-row"><span>'+m.label+'</span><span>'+m.fmt(m.value(q.row))+'</span></div><div class="tip-row"><span>调用</span><span>'+f(q.row.calls)+'</span></div><div class="tip-row"><span>失败</span><span>'+f(q.row.failures)+'</span></div>')};c.onmouseleave=hideTip;c.onclick=e=>{const q=hit.hour.find(v=>e.offsetX>=v.x-2&&e.offsetX<=v.x+v.w+2);if(q)setFilter('hour',q.row.hour)}}
function renderDonut(){const {c,x,w,h}=setup('#donut'),m=metrics[state.metric],kind=state.group,source=rankRows(kind).filter(r=>m.value(r)>0),top=source.slice(0,8),rest=source.slice(8),restValue=rest.reduce((s,r)=>s+m.value(r),0),rows=restValue?[...top,{name:'其他',__other:true,__value:restValue}]:top,total=rows.reduce((s,r)=>s+(r.__value??m.value(r)),0),cx=w/2,cy=h/2,r=Math.min(w,h)*.31,lw=Math.max(18,r*.28);$('#donutTitle').textContent=(kind==='tool'?'工具':'任务 / 子 Agent')+'构成 · '+m.label;hit.donut=[];if(!total){x.strokeStyle='#edf1f5';x.lineWidth=lw;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();x.fillStyle='#9aa5b4';x.textAlign='center';x.font='11px system-ui';x.fillText('暂无数据',cx,cy+4);$('#legend').innerHTML='<div class="empty">当前筛选下暂无构成数据</div>';return}let a=-Math.PI/2;rows.forEach((row,i)=>{const v=row.__value??m.value(row),span=Math.PI*2*v/total,end=a+span,gap=Math.min(.018,span*.12);x.strokeStyle=palette[i%palette.length];x.lineWidth=lw;x.lineCap='butt';x.beginPath();x.arc(cx,cy,r,a+gap,end-gap);x.stroke();hit.donut.push({start:a,end,row,value:v,color:palette[i%palette.length]});a=end});x.textAlign='center';x.fillStyle='#243449';x.font='700 20px system-ui';x.fillText(m.fmt(total),cx,cy+1);x.fillStyle='#8b97a7';x.font='10px system-ui';x.fillText(m.label,cx,cy+18);$('#legend').innerHTML=hit.donut.map((q,i)=>'<button class="legend-btn '+(!q.row.__other&&state.filters[kind]===q.row.name?'on':'')+'" data-legend="'+i+'" '+(q.row.__other?'disabled':'')+'><i class="dot" style="background:'+q.color+'"></i><span class="legend-name">'+esc(q.row.name)+'</span><span class="legend-val">'+m.fmt(q.value)+' · '+pct(q.value,total)+'%</span></button>').join('');$$('[data-legend]').forEach(b=>b.onclick=()=>{const q=hit.donut[Number(b.dataset.legend)];if(q&&!q.row.__other)setFilter(kind,q.row.name)});function target(e){const dx=e.offsetX-cx,dy=e.offsetY-cy,dist=Math.hypot(dx,dy);if(dist<r-lw/2-5||dist>r+lw/2+5)return null;let ang=Math.atan2(dy,dx);if(ang< -Math.PI/2)ang+=Math.PI*2;return hit.donut.find(q=>ang>=q.start&&ang<=q.end)}c.onmousemove=e=>{const q=target(e);if(!q)return hideTip();showTip(e,'<strong>'+esc(q.row.name)+'</strong><div class="tip-row"><span>'+m.label+'</span><span>'+m.fmt(q.value)+'</span></div><div class="tip-row"><span>占比</span><span>'+pct(q.value,total)+'%</span></div>')};c.onmouseleave=hideTip;c.onclick=e=>{const q=target(e);if(q&&!q.row.__other)setFilter(kind,q.row.name)}}

function pretty(v){try{return JSON.stringify(v,null,2)}catch{return String(v??'')}}function outputText(v){if(v&&Array.isArray(v.content)){const parts=v.content.map(x=>typeof x==='string'?x:(x&&x.type==='text'?x.text:pretty(x))).filter(Boolean);if(parts.length)return parts.join('\n\n')}return typeof v==='string'?v:pretty(v)}
function closeDetail(){$('#detailBackdrop').classList.remove('open');$('#detailBackdrop').setAttribute('aria-hidden','true');document.body.classList.remove('detail-open')}async function fetchDetail(row){const q='?ts='+encodeURIComponent(row.ts)+'&tool='+encodeURIComponent(row.tool||'')+'&eventId='+encodeURIComponent(row.eventId||'');let res=null;try{res=await fetch('/api/call-detail'+q,{cache:'no-store'});if(!res.ok)throw new Error('primary unavailable')}catch{try{res=await fetch('http://127.0.0.1:17892/api/call-detail'+q,{cache:'no-store'})}catch{return null}}if(!res||!res.ok)return null;return res.json()}
async function openDetail(row){$('#detailBackdrop').classList.add('open');$('#detailBackdrop').setAttribute('aria-hidden','false');document.body.classList.add('detail-open');$('#detailTitle').textContent=row.tool||'调用详情';$('#detailSub').textContent=new Date(row.ts).toLocaleString()+' · '+(row.taskLabel||'未标注任务');$('#detailBody').innerHTML='<div class="detail-loading">正在读取调用详情…</div>';const d=await fetchDetail(row);if(!d){$('#detailBody').innerHTML='<div class="detail-empty">这条记录只有统计数据，没有可读取的调用正文。较早历史记录可能属于这种情况。</div>';return}const meta='<div class="detail-meta"><span class="detail-pill">'+esc(d.toolName||row.tool||'unknown')+'</span><span class="detail-pill">'+esc(row.status||'unknown')+'</span><span class="detail-pill">'+esc(fd(d.duration??row.durationMs))+'</span><span class="detail-pill">匹配 '+esc(d.matchedDeltaMs??0)+' ms</span></div>';$('#detailBody').innerHTML=meta+'<section class="detail-section"><h3>调用参数</h3><pre class="detail-pre">'+esc(pretty(d.arguments))+'</pre></section><section class="detail-section"><h3>返回内容</h3><pre class="detail-pre">'+esc(outputText(d.output))+'</pre></section><section class="detail-section"><h3>原始返回 JSON</h3><pre class="detail-pre">'+esc(pretty(d.output))+'</pre></section>'}
$('#detailClose').onclick=closeDetail;$('#detailBackdrop').onclick=e=>{if(e.target===$('#detailBackdrop'))closeDetail()};addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
function renderRecent(){const rows=data.recent||[];$('#recentHint').textContent='最近 '+Math.min(60,rows.length)+' 条 · 点击整行查看实际调用内容，点击任务或工具筛选';$('#recent').innerHTML=rows.length?rows.map((x,i)=>{const task=x.taskLabel||'未标注任务',status=x.status||'unknown';return '<tr class="recent-row" data-detail-index="'+i+'"><td>'+new Date(x.ts).toLocaleString()+'</td><td><button class="filter-link" data-r-task="'+esc(task)+'">'+esc(task)+'</button></td><td><button class="filter-link" data-r-tool="'+esc(x.tool||'unknown')+'">'+esc(x.tool||'unknown')+'</button></td><td><span class="status-badge '+(status==='error'?'bad':status==='ok'?'':'')+'">'+esc(status)+'</span></td><td>'+f(x.outputTokens)+'</td><td>'+f(x.inputTokens)+'</td><td>'+fd(x.durationMs)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">当前筛选条件下没有调用记录</td></tr>';$$('[data-detail-index]').forEach(r=>r.onclick=e=>{if(e.target.closest('.filter-link'))return;openDetail(rows[Number(r.dataset.detailIndex)])});$$('[data-r-task]').forEach(b=>b.onclick=e=>{e.stopPropagation();setFilter('task',b.dataset.rTask)});$$('[data-r-tool]').forEach(b=>b.onclick=e=>{e.stopPropagation();setFilter('tool',b.dataset.rTool)})}
function renderAll(){if(!data)return;renderChrome();renderCards();renderTrend();renderDonut();renderRank('tool');renderRank('task');renderHour();renderRecent()}
async function load(){const seq=++loadSeq;try{const res=await fetch('/api/summary?'+query(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const next=await res.json();if(seq!==loadSeq)return;data=next;data.scope=data.scope||data.range;renderAll()}catch(e){if(seq!==loadSeq)return;$('#scope').textContent='数据加载失败：'+e.message}}
$$('[data-days]').forEach(b=>b.onclick=()=>{state.days=Number(b.dataset.days);state.filters.day='';state.filters.hour=null;load()});$('#metric').onchange=e=>{state.metric=e.target.value;renderAll()};$('#group').onchange=e=>{state.group=e.target.value;renderDonut()};$('#status').onchange=e=>{state.filters.status=e.target.value;load()};$('#clear').onclick=clearFilters;
$('#toolSearch').oninput=e=>{state.toolSearch=e.target.value;renderRank('tool')};$('#taskSearch').oninput=e=>{state.taskSearch=e.target.value;renderRank('task')};
addEventListener('resize',()=>{clearTimeout(window.__resize);window.__resize=setTimeout(()=>{if(data){renderTrend();renderDonut();renderHour()}},120)});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},5000);
let uiVersion=null;async function checkUi(){try{const v=(await fetch('/api/ui-version',{cache:'no-store'}).then(r=>r.json())).version;if(uiVersion===null)uiVersion=v;else if(v&&v!==uiVersion)location.reload()}catch{}}setInterval(checkUi,2000);checkUi();load();
